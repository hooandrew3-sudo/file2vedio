<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File to Video - Convert Articles to MP4</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f0ff;
        }

        .upload-area.dragover {
            background: #e8e8ff;
            border-color: #764ba2;
            transform: scale(1.02);
        }

        .upload-area svg {
            width: 60px;
            height: 60px;
            color: #667eea;
            margin-bottom: 15px;
        }

        .upload-area p {
            color: #666;
            margin-bottom: 10px;
        }

        .upload-area small {
            color: #999;
            display: block;
        }

        input[type="file"] {
            display: none;
        }

        .file-input {
            display: none;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        select:focus, input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .selected-file {
            background: #f0f7ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .selected-file.show {
            display: block;
        }

        .selected-file p {
            margin: 5px 0;
            color: #333;
        }

        .file-name {
            font-weight: 600;
            color: #667eea;
        }

        .file-size {
            color: #999;
            font-size: 0.9em;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .status-message.show {
            display: block;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #f5c6cb;
        }

        .status-message.info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid #bee5eb;
        }

        .download-link {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        .download-link:hover {
            background: #218838;
        }

        .footer {
            text-align: center;
            color: #999;
            font-size: 0.9em;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 File to Video</h1>
            <p>Convert your articles to MP4 videos with AI text-to-speech</p>
        </div>

        <form id="uploadForm">
            <div class="upload-area" id="uploadArea">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <p>Drop your file here or click to upload</p>
                <small>Supported formats: TXT, MD, PDF, DOCX (Max 50MB)</small>
                <input type="file" id="fileInput" accept=".txt,.md,.pdf,.docx" />
            </div>

            <div class="selected-file" id="selectedFile">
                <p>📄 <span class="file-name" id="fileName"></span></p>
                <p class="file-size" id="fileSize"></p>
                <button type="button" id="clearBtn">Clear</button>
            </div>

            <div class="form-group">
                <label for="language">Language for Text-to-Speech</label>
                <select id="language">
                    <option value="en">English</option>
                    <option value="zh">Chinese (Mandarin)</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="ja">Japanese</option>
                </select>
            </div>

            <button type="button" id="uploadBtn" disabled>Upload & Start Processing</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p id="loadingText">Uploading file...</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p id="progressText">0%</p>
        </div>

        <div class="status-message" id="statusMessage"></div>

        <div class="footer">
            <p>Powered by Cloudflare Workers & AI</p>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const selectedFile = document.getElementById('selectedFile');
        const clearBtn = document.getElementById('clearBtn');
        const loading = document.getElementById('loading');
        const statusMessage = document.getElementById('statusMessage');
        const languageSelect = document.getElementById('language');

        let selectedFileData = null;
        let jobId = null;

        // File upload handling
        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileSelect(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        function handleFileSelect(file) {
            selectedFileData = file;
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = `${(file.size / 1024 / 1024).toFixed(2)} MB`;
            selectedFile.classList.add('show');
            uploadBtn.disabled = false;
            uploadArea.style.opacity = '0.5';
        }

        clearBtn.addEventListener('click', () => {
            selectedFileData = null;
            fileInput.value = '';
            selectedFile.classList.remove('show');
            uploadBtn.disabled = true;
            uploadArea.style.opacity = '1';
            statusMessage.classList.remove('show');
        });

        uploadBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            if (!selectedFileData) return;

            const formData = new FormData();
            formData.append('file', selectedFileData);

            try {
                loading.style.display = 'block';
                document.getElementById('loadingText').textContent = 'Uploading file...';
                updateProgress(10);

                const uploadResponse = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                const uploadData = await uploadResponse.json();
                if (!uploadResponse.ok) throw new Error(uploadData.error);

                jobId = uploadData.jobId;
                updateProgress(40);
                document.getElementById('loadingText').textContent = 'Processing video...';

                const processResponse = await fetch('/api/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jobId: jobId,
                        language: languageSelect.value
                    })
                });

                const processData = await processResponse.json();
                if (!processResponse.ok) throw new Error(processData.error);

                // Poll for status
                pollStatus();
            } catch (error) {
                showMessage('error', error.message);
                loading.style.display = 'none';
            }
        });

        function updateProgress(percent) {
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressText').textContent = percent + '%';
        }

        async function pollStatus() {
            const maxAttempts = 120; // 2 minutes with 1-second intervals
            let attempts = 0;

            const interval = setInterval(async () => {
                attempts++;
                try {
                    const response = await fetch(`/api/status/${jobId}`);
                    const data = await response.json();

                    updateProgress(data.progress);
                    document.getElementById('loadingText').textContent = `Processing... ${data.status}`;

                    if (data.status === 'completed') {
                        clearInterval(interval);
                        loading.style.display = 'none';
                        showMessage('success', `✅ Video ready! <a href="/api/download/${jobId}" class="download-link">Download MP4</a>`);
                        clearBtn.click();
                    } else if (data.status === 'failed') {
                        clearInterval(interval);
                        loading.style.display = 'none';
                        showMessage('error', `Processing failed: ${data.error}`);
                    } else if (attempts >= maxAttempts) {
                        clearInterval(interval);
                        loading.style.display = 'none';
                        showMessage('error', 'Processing timeout');
                    }
                } catch (error) {
                    if (attempts >= maxAttempts) {
                        clearInterval(interval);
                        loading.style.display = 'none';
                        showMessage('error', `Error: ${error.message}`);
                    }
                }
            }, 1000);
        }

        function showMessage(type, message) {
            statusMessage.className = `status-message show ${type}`;
            statusMessage.innerHTML = message;
        }
    </script>
</body>
</html>
