name = "file2vedio"
main = "src/index.js"
compatibility_date = "2024-01-01"

[env.production]
route = "file2vedio.pages.dev"

[env.staging]
route = "file2vedio-staging.pages.dev"

[build]
command = "npm install && npm run build"
directory = "dist"

[[r2_buckets]]
binding = "VIDEOS"
bucket_name = "file2vedio-videos"
preview_bucket_name = "file2vedio-videos-preview"

[[durable_objects.bindings]]
name = "TASK_QUEUE"
class_name = "TaskQueue"
script_name = "file2vedio-worker"

[env.production.vars]
API_ENDPOINT = "https://api.file2vedio.com"
ENV = "production"

[env.staging.vars]
API_ENDPOINT = "https://api-staging.file2vedio.com"
ENV = "staging"

[observability]
enabled = true